backend:
  name: git-gateway
  branch: main

# Lets you run the CMS locally against the filesystem with `npx decap-server`
# alongside `npm run dev`. Netlify Identity + Git Gateway handle auth in production.
local_backend: true

media_folder: "/public/uploads"
public_folder: "/uploads"

publish_mode: simple

collections:
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "src/content/projects"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{fields.slug}}"
    summary: "{{order}} — {{title}}"
    sortable_fields: ["order", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Slug",
          name: "slug",
          widget: "string",
          hint: "Used in the project URL, e.g. rigging-toolkit -> /projects/rigging-toolkit",
        }
      - {
          label: "Cover Image",
          name: "cover",
          widget: "image",
          media_folder: "/public/uploads",
          public_folder: "/uploads",
        }
      - {
          label: "Gallery",
          name: "gallery",
          widget: "list",
          field:
            {
              label: "Image or Video",
              name: "media",
              widget: "file",
              media_folder: "/public/uploads",
              public_folder: "/uploads",
            },
          required: false,
          hint: "Extra images or short video clips shown in the project's slideshow popup, in addition to the cover image — video vs. image is detected automatically from the file",
        }
      - {
          label: "Gallery Video Playback",
          name: "galleryVideoPlayback",
          widget: "select",
          options:
            [
              { label: "Fixed duration (same as images, loops if shorter)", value: "fixed" },
              { label: "Play full video length, then advance", value: "full" },
            ],
          default: "fixed",
          required: false,
          hint: "Controls how long a video clip in the Gallery stays on screen in the project's full-screen slideshow",
        }
      - {
          label: "Video Link",
          name: "video",
          widget: "string",
          required: false,
          hint: "YouTube or Vimeo URL for the project breakdown video",
        }
      - {
          label: "3D Model (.glb / .gltf)",
          name: "model",
          widget: "file",
          required: false,
          media_folder: "/public/models",
          public_folder: "/models",
          hint: "Optional — an interactive 3D preview (rig, topology, prop) rendered with <model-viewer>",
        }
      - {
          label: "Click Effect",
          name: "clickEffect",
          widget: "select",
          options:
            [
              "none",
              "leaf",
              "smoke",
              "converge",
              "slash",
              "skull",
              "glass",
              "explosion",
              "bubble",
              "wind",
              "sparkle",
              "domain-slash",
            ],
          default: "none",
          required: false,
          hint: "A playful particle effect that plays when this card is clicked, before opening the project. Domain Slash instead cuts the clicked card itself in half before it opens.",
        }
      - {
          label: "Ambient Background Effect",
          name: "ambientEffect",
          widget: "select",
          options: ["none", "smoke", "embers", "dust", "snow", "fireflies", "fog"],
          default: "none",
          required: false,
          hint: "A subtle looping atmosphere effect that plays continuously while this project's full-screen view is open",
        }
      - {
          label: "Ambient Effect Appears On",
          name: "ambientEffectScope",
          widget: "select",
          options:
            [
              { label: "All images/videos in the gallery", value: "all" },
              { label: "Only the first slide (cover image)", value: "first" },
            ],
          default: "all",
          required: false,
          hint: "Controls whether the ambient atmosphere effect plays throughout the whole slideshow or only over the first slide",
        }
      - {
          label: "Ambient Custom Video (optional)",
          name: "ambientVideoUrl",
          widget: "file",
          required: false,
          media_folder: "/public/ambient",
          public_folder: "/ambient",
          hint: "Upload your own looping video overlay instead of a preset — overrides Ambient Background Effect above",
        }
      - {
          label: "Tech Stack",
          name: "techStack",
          widget: "list",
          hint: "e.g. Python, Houdini, HLSL",
        }
      - {
          label: "Short Description",
          name: "description",
          widget: "text",
          hint: "Shown on the project card in the gallery",
        }
      - {
          label: "Order",
          name: "order",
          widget: "number",
          default: 0,
          hint: "Lower numbers appear first — use this to reorder the gallery",
        }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "professional"
    label: "Professional Projects"
    label_singular: "Professional Project"
    folder: "src/content/professional"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{fields.slug}}"
    summary: "{{order}} — {{title}} ({{role}})"
    sortable_fields: ["order", "date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Slug",
          name: "slug",
          widget: "string",
          hint: "Used in the URL, e.g. rig-toolkit -> /professional/rig-toolkit",
        }
      - {
          label: "Cover Image",
          name: "cover",
          widget: "image",
          media_folder: "/public/uploads",
          public_folder: "/uploads",
        }
      - {
          label: "Your Role",
          name: "role",
          widget: "string",
          hint: "e.g. Rigging Artist, Tools Programmer — shown on the card and the write-up",
        }
      - {
          label: "Date",
          name: "date",
          widget: "string",
          hint: "YYYY or YYYY-MM, e.g. 2024-06",
          pattern: ["^\\d{4}(-\\d{2})?$", "Use YYYY or YYYY-MM"],
        }
      - {
          label: "Company / Collaborator",
          name: "company",
          widget: "string",
          required: false,
          hint: "Studio, client, or person you worked with — leave blank for solo outside work",
        }
      - {
          label: "Company / Collaborator Link",
          name: "companyUrl",
          widget: "string",
          required: false,
        }
      - {
          label: "Short Description",
          name: "description",
          widget: "text",
          hint: "Shown on the project card",
        }
      - {
          label: "Order",
          name: "order",
          widget: "number",
          default: 0,
          hint: "Lower numbers appear first",
        }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "history"
    label: "History"
    label_singular: "History Entry"
    folder: "src/content/history"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{fields.date}}-{{fields.title}}"
    summary: "{{date}} — {{title}}"
    sortable_fields: ["date", "title"]
    fields:
      - {
          label: "Date",
          name: "date",
          widget: "string",
          hint: "YYYY or YYYY-MM, e.g. 2021-02 — controls the timeline order",
          pattern: ["^\\d{4}(-\\d{2})?$", "Use YYYY or YYYY-MM"],
        }
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Title (Bahasa Indonesia)",
          name: "titleId",
          widget: "string",
          required: false,
          hint: "Optional — shown instead of Title on the Indonesian CV download. Leave blank to reuse Title as-is.",
        }
      - {
          label: "Organization",
          name: "organization",
          widget: "string",
          required: false,
          hint: "Studio, school, or client name — e.g. \"Stormwatch Games\". Shown on the CV's Experience/Education sections and the on-site timeline.",
        }
      - {
          label: "Organization (Bahasa Indonesia)",
          name: "organizationId",
          widget: "string",
          required: false,
          hint: "Optional Indonesian version of Organization. Leave blank to reuse the field above.",
        }
      - {
          label: "Description",
          name: "description",
          widget: "text",
          hint: "One line for a plain sentence, or several lines (press Enter between them) to show as bullet points on the CV — e.g. one achievement per line.",
        }
      - {
          label: "Description (Bahasa Indonesia)",
          name: "descriptionId",
          widget: "text",
          required: false,
          hint: "Optional Indonesian translation, same one-line-or-bullets rule as Description above. Leave blank to show the English Description on the Indonesian CV too.",
        }
      - {
          label: "Tag",
          name: "tag",
          widget: "select",
          options: ["origin", "education", "job", "release", "current"],
          required: false,
          hint: "Controls the timeline marker color. Also controls the CV: \"education\" entries go under Education, everything except \"origin\" goes under Professional Experience — \"origin\" entries (personal milestones) show on the on-site timeline only, not the downloadable CV.",
        }

  - name: "settings"
    label: "Resume / Skills"
    files:
      - name: "resume"
        label: "Resume & Skills"
        file: "src/data/resume.json"
        fields:
          - { label: "Full Name", name: "name", widget: "string" }
          - { label: "Headline / Title", name: "title", widget: "string" }
          - {
              label: "Role",
              name: "role",
              widget: "string",
              hint: "Short job title — e.g. \"3D Artist\" or \"Technical Artist\". Shown as the small tag above your name in the Hero, and under your name on the CV.",
            }
          - {
              label: "Role (Bahasa Indonesia)",
              name: "roleId",
              widget: "string",
              required: false,
              hint: "Optional — shown instead of Role on the Indonesian CV download. Leave blank to reuse Role as-is.",
            }
          - {
              label: "Intro Animation Title",
              name: "introTitle",
              widget: "string",
              required: false,
              hint: "Shown briefly on the opening animation when a visitor first lands on the site. Leave blank to reuse Headline / Title above.",
            }
          - {
              label: "Intro Animation Style",
              name: "introStyle",
              widget: "select",
              options: [
                { label: "Elegant (slower, graceful)", value: "elegant" },
                { label: "Fast / Modern (quick, sharp, mechanical)", value: "fast" },
              ],
              default: "elegant",
              required: false,
            }
          - { label: "Tagline", name: "tagline", widget: "text" }
          - {
              label: "Professional Summary (CV)",
              name: "cvSummary",
              widget: "text",
              required: false,
              hint: "2-3 sentences for the downloadable CV specifically — more formal than the Tagline above, which is written for the website's Hero. Leave blank to reuse the Tagline.",
            }
          - {
              label: "Professional Summary (Bahasa Indonesia)",
              name: "cvSummaryId",
              widget: "text",
              required: false,
              hint: "Optional Indonesian translation of the Professional Summary above, for the Indonesian CV download. Leave blank to show the English summary there too.",
            }
          - {
              label: "Location",
              name: "location",
              widget: "string",
              required: false,
              hint: "City, Country — shown on the CV's contact line. Leave blank to omit it.",
            }
          - { label: "Contact Email", name: "email", widget: "string" }
          - { label: "GitHub URL", name: "githubUrl", widget: "string" }
          - { label: "ArtStation URL", name: "artstationUrl", widget: "string" }
          - { label: "YouTube URL", name: "youtubeUrl", widget: "string", required: false }
          - { label: "X (Twitter) URL", name: "xUrl", widget: "string", required: false }
          - { label: "Instagram URL", name: "instagramUrl", widget: "string", required: false }
          - { label: "LinkedIn URL", name: "linkedinUrl", widget: "string", required: false }
          - {
              label: "Reel Background Video",
              name: "reelVideoUrl",
              widget: "file",
              media_folder: "/public/videos",
              public_folder: "/videos",
            }
          - label: "Hero Slideshow"
            name: "heroSlides"
            widget: "list"
            summary: "{{fields.caption}}"
            hint: "Background slides for the homepage hero — fades between them on a timer. ⚠ If you add a new slide, finish filling it in (or delete it with the X) before clicking Publish — publishing with an empty/unfinished slide causes a CMS error."
            typeKey: "slideKind"
            types:
              - label: "Single Slide"
                name: "single"
                widget: "object"
                fields:
                  - {
                      label: "Media (image or video — detected automatically from the file)",
                      name: "src",
                      widget: "file",
                      media_folder: "/public/hero",
                      public_folder: "/hero",
                    }
                  - {
                      label: "Duration (seconds)",
                      name: "duration",
                      widget: "number",
                      default: 6,
                    }
                  - { label: "Caption", name: "caption", widget: "string", required: false }
              - label: "Comparison Group (2+ videos of the SAME shot)"
                name: "compare"
                widget: "object"
                hint: "⚠ Only combine videos that are the same animation/camera move — e.g. a solid-shading pass and a fully-textured pass of one render. Combining unrelated clips will look broken, since these modes assume every video lines up frame-for-frame."
                default:
                  mode: "fade"
                  sources:
                    - { src: "", label: "" }
                    - { src: "", label: "" }
                fields:
                  - label: "Combine Mode"
                    name: "mode"
                    widget: "select"
                    default: "fade"
                    options:
                      - { label: "Fade between them", value: "fade" }
                      - { label: "Split left/right", value: "split-horizontal" }
                      - { label: "Split up/down", value: "split-vertical" }
                  - label: "Videos to Combine (in order)"
                    name: "sources"
                    widget: "list"
                    summary: "{{fields.label}}"
                    min: 2
                    default:
                      - { src: "", label: "" }
                      - { src: "", label: "" }
                    fields:
                      - {
                          label: "Video",
                          name: "src",
                          widget: "file",
                          media_folder: "/public/hero",
                          public_folder: "/hero",
                        }
                      - { label: "Label (optional)", name: "label", widget: "string", required: false }
                  - {
                      label: "Duration per video (seconds, fade mode only)",
                      name: "duration",
                      widget: "number",
                      default: 4,
                    }
                  - { label: "Caption", name: "caption", widget: "string", required: false }
          - label: "Skills"
            name: "skills"
            widget: "list"
            summary: "{{category}}"
            fields:
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Items", name: "items", widget: "list" }
